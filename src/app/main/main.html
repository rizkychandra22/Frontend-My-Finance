<div [ngClass]="isDarkMode() ? 'bg-slate-950 text-slate-100' : 'bg-[#FAF8F5] text-slate-800'" class="h-screen overflow-hidden flex transition-colors duration-300 pb-20 md:pb-0">

  <!-- ================= DESKTOP SIDEBAR (Compact sm size) ================= -->
  <aside 
    [ngClass]="[
      isDarkMode() ? 'bg-slate-900/30 border-slate-900 text-slate-400' : 'bg-white border-slate-200 text-slate-600',
      isSidebarCollapsed() ? 'w-16 px-2 py-4' : 'w-56 p-4'
    ]"
    class="hidden md:flex flex-col justify-between h-screen sticky top-0 border-r flex-shrink-0 transition-all duration-300"
  >
    <div class="space-y-6">
      <!-- Logo App (Compact) -->
      <div class="flex items-center gap-2.5 transition-all duration-300" [ngClass]="isSidebarCollapsed() ? 'justify-center' : ''">
        <div class="w-8 h-8 rounded-lg bg-blue-600/10 border border-blue-500/30 text-blue-500 text-base font-bold flex items-center justify-center shadow-inner flex-shrink-0">
          MF
        </div>
        <div *ngIf="!isSidebarCollapsed()" class="transition-all duration-300">
          <h1 [ngClass]="isDarkMode() ? 'text-slate-100' : 'text-slate-900'" class="text-sm font-bold tracking-tight">My-Finance</h1>
          <p class="text-[8px] text-slate-400 font-semibold uppercase tracking-wider">Manajemen Keuangan</p>
        </div>
      </div>

      <!-- Navigation List (Tighter space-y-4) -->
      <nav class="space-y-4">
        <!-- Group 1: Ikhtisar -->
        <div class="space-y-1.5">
          <p *ngIf="!isSidebarCollapsed()" class="text-[9px] font-bold uppercase tracking-widest text-slate-400/80 px-1">Ikhtisar</p>
          <div class="space-y-0.5">
            <button 
              (click)="setActiveTab('dashboard')"
              [ngClass]="[
                activeTab() === 'dashboard' ? (isDarkMode() ? 'bg-slate-900 text-slate-100 border-l-2 border-blue-500' : 'bg-slate-100 text-slate-900 border-l-2 border-blue-600') : 'hover:bg-slate-100/50 dark:hover:bg-slate-900/50',
                isSidebarCollapsed() ? 'justify-center px-0' : 'px-2.5'
              ]"
              class="w-full text-left py-2 rounded-lg text-[11px] font-semibold flex items-center gap-2.5 transition-all cursor-pointer"
              [title]="isSidebarCollapsed() ? 'Dashboard' : ''"
            >
              <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
              <span *ngIf="!isSidebarCollapsed()">Dashboard</span>
            </button>
            <button 
              (click)="setActiveTab('analitik')"
              [ngClass]="[
                activeTab() === 'analitik' ? (isDarkMode() ? 'bg-slate-900 text-slate-100 border-l-2 border-blue-500' : 'bg-slate-100 text-slate-900 border-l-2 border-blue-600') : 'hover:bg-slate-100/50 dark:hover:bg-slate-900/50',
                isSidebarCollapsed() ? 'justify-center px-0' : 'px-2.5'
              ]"
              class="w-full text-left py-2 rounded-lg text-[11px] font-semibold flex items-center gap-2.5 transition-all cursor-pointer"
              [title]="isSidebarCollapsed() ? 'Analitik Grafik' : ''"
            >
              <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
              </svg>
              <span *ngIf="!isSidebarCollapsed()">Analitik Grafik</span>
            </button>
          </div>
        </div>

        <!-- Group 2: Manajemen -->
        <div class="space-y-1.5">
          <p *ngIf="!isSidebarCollapsed()" class="text-[9px] font-bold uppercase tracking-widest text-slate-400/80 px-1">Manajemen</p>
          <div class="space-y-0.5">
            <button 
              (click)="setActiveTab('rekening')"
              [ngClass]="[
                activeTab() === 'rekening' ? (isDarkMode() ? 'bg-slate-900 text-slate-100 border-l-2 border-blue-500' : 'bg-slate-100 text-slate-900 border-l-2 border-blue-600') : 'hover:bg-slate-100/50 dark:hover:bg-slate-900/50',
                isSidebarCollapsed() ? 'justify-center px-0' : 'px-2.5'
              ]"
              class="w-full text-left py-2 rounded-lg text-[11px] font-semibold flex items-center gap-2.5 transition-all cursor-pointer"
              [title]="isSidebarCollapsed() ? 'Data Rekening' : ''"
            >
              <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
              </svg>
              <span *ngIf="!isSidebarCollapsed()">Data Rekening</span>
            </button>
            <button 
              (click)="setActiveTab('transaksi')"
              [ngClass]="[
                activeTab() === 'transaksi' ? (isDarkMode() ? 'bg-slate-900 text-slate-100 border-l-2 border-blue-500' : 'bg-slate-100 text-slate-900 border-l-2 border-blue-600') : 'hover:bg-slate-100/50 dark:hover:bg-slate-900/50',
                isSidebarCollapsed() ? 'justify-center px-0' : 'px-2.5'
              ]"
              class="w-full text-left py-2 rounded-lg text-[11px] font-semibold flex items-center gap-2.5 transition-all cursor-pointer"
              [title]="isSidebarCollapsed() ? 'Transaksi Log' : ''"
            >
              <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
              </svg>
              <span *ngIf="!isSidebarCollapsed()">Log Transaksi</span>
            </button>
          </div>
        </div>
      </nav>
    </div>

    <!-- Desktop Profile Box (Compact) -->
    <div [ngClass]="[isDarkMode() ? 'border-slate-800' : 'border-slate-200', isSidebarCollapsed() ? 'justify-center' : 'justify-between']" class="pt-3 border-t flex items-center">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-7 h-7 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-[10px] shadow flex-shrink-0">
          RC
        </div>
        <div *ngIf="!isSidebarCollapsed()" class="flex flex-col min-w-0 transition-all duration-300">
          <span [ngClass]="isDarkMode() ? 'text-slate-200' : 'text-slate-800'" class="text-[11px] font-bold truncate block">{{ username() }}</span>
          <span class="text-[8px] text-slate-400 truncate block">Personal Planner</span>
        </div>
      </div>
      <div *ngIf="!isSidebarCollapsed()" class="flex items-center gap-1 flex-shrink-0">
        <!-- Setting Button -->
        <button 
          (click)="openSettingsModal()"
          [ngClass]="isDarkMode() ? 'hover:bg-slate-800 text-slate-400 hover:text-white' : 'hover:bg-slate-100 text-slate-500 hover:text-slate-900'"
          class="p-1 rounded-lg transition-colors cursor-pointer flex-shrink-0"
          title="Pengaturan Profil"
        >
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>

        <!-- Logout Button -->
        <button 
          (click)="onLogout()" 
          [ngClass]="isDarkMode() ? 'hover:bg-slate-800 text-slate-400 hover:text-white' : 'hover:bg-slate-100 text-slate-500 hover:text-slate-900'"
          class="p-1 rounded-lg transition-colors cursor-pointer flex-shrink-0" 
          aria-label="Logout"
          title="Logout"
        >
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ================= MAIN LAYOUT AREA ================= -->
  <div class="flex-grow flex flex-col min-w-0 md:h-screen md:overflow-hidden">
    
    <!-- DESKTOP TOP HEADER (Compact px-6 py-2.5 - sm size) -->
    <header 
      [ngClass]="isDarkMode() ? 'bg-slate-950/70 border-slate-900' : 'bg-white border-slate-200'"
      class="hidden md:flex items-center justify-between px-6 py-2.5 border-b transition-colors duration-300"
    >
      <!-- Left Controls (Collapse Toggle & Breadcrumbs) -->
      <div class="flex items-center">
        <!-- Sidebar Toggle Icon -->
        <button 
          (click)="toggleSidebar()" 
          [ngClass]="isDarkMode() ? 'hover:bg-slate-900 text-slate-400' : 'hover:bg-slate-100 text-slate-600'" 
          class="p-1.5 rounded-lg transition-all cursor-pointer mr-3 flex items-center justify-center focus:outline-none"
          title="Toggle Navigasi"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
        </button>

        <!-- Breadcrumbs -->
        <div class="flex items-center gap-1.5 text-[11px] font-semibold text-slate-400">
          <span>Dashboard</span>
          <span>&rsaquo;</span>
          <span [ngClass]="isDarkMode() ? 'text-slate-200' : 'text-slate-700'" class="capitalize">
            {{ activeTab() === 'dashboard' ? 'Overview' : activeTab() }}
          </span>
        </div>
      </div>

      <!-- Right Side Actions -->
      <div class="flex items-center gap-4">
        <!-- Search bar -->
        <div class="relative">
          <input 
            type="text" 
            placeholder="Cari..."
            [ngClass]="isDarkMode() ? 'bg-slate-900 border-slate-800 placeholder-slate-600 text-slate-350' : 'bg-slate-100 border-slate-200 placeholder-slate-400 text-slate-700'"
            class="pl-7 pr-3 py-1 border rounded-lg text-[11px] w-36 focus:w-44 transition-all duration-200 focus:outline-none"
          />
          <svg class="w-3.5 h-3.5 absolute left-2.5 top-2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>

        <!-- Notification bell -->
        <button [ngClass]="isDarkMode() ? 'text-slate-400 hover:text-white' : 'text-slate-500 hover:text-slate-900'" class="relative p-1 transition-colors cursor-pointer">
          <div class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-orange-500"></div>
          <svg class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </button>

        <!-- Theme Toggle -->
        <button 
          (click)="toggleTheme()" 
          [ngClass]="isDarkMode() ? 'text-amber-400' : 'text-slate-500 hover:text-slate-900'"
          class="p-1 transition-all cursor-pointer"
        >
          <svg *ngIf="isDarkMode()" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
          </svg>
          <svg *ngIf="!isDarkMode()" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- MOBILE HEADER (Standard Large Size - NOT sm) -->
    <header 
      [ngClass]="isDarkMode() ? 'bg-slate-950/95 border-slate-900' : 'bg-white border-slate-200'"
      class="flex md:hidden items-center justify-between px-6 py-4 border-b transition-colors duration-300 sticky top-0 z-40 backdrop-blur-md shadow-sm"
    >
      <div class="flex items-center gap-3">
        <!-- Avatar User -->
        <div class="w-9 h-9 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xs shadow-inner">
          RC
        </div>
        <!-- User Info -->
        <div class="flex flex-col">
          <span [ngClass]="isDarkMode() ? 'text-slate-100' : 'text-slate-800'" class="text-xs font-bold tracking-tight">{{ username() }}</span>
          <span class="text-[9px] text-slate-400 font-medium">Personal Finance</span>
        </div>
      </div>

      <!-- Right mobile controls -->
      <div class="flex items-center gap-4">
        <!-- Notification bell -->
        <button [ngClass]="isDarkMode() ? 'text-slate-400 hover:text-white' : 'text-slate-500 hover:text-slate-900'" class="relative p-1 cursor-pointer">
          <div class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-orange-500 border border-white"></div>
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </button>

        <!-- Theme Toggle -->
        <button 
          (click)="toggleTheme()" 
          [ngClass]="isDarkMode() ? 'text-amber-400' : 'text-slate-500 hover:text-slate-900'"
          class="p-1 cursor-pointer"
        >
          <svg *ngIf="isDarkMode()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
          </svg>
          <svg *ngIf="!isDarkMode()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- CONTENT WRAPPER (Compact sm sizes: p-5, gap-5, space-y-6) -->
    <main class="flex-grow p-5 md:p-6 space-y-6 overflow-y-auto">
      
      <!-- Tab 1: Dashboard (Overview) -->
      <app-overview 
        [class.hidden]="activeTab() !== 'dashboard'"
        [accounts]="accounts()"
        [transactions]="transactions()"
        [monthlyIncome]="monthlyIncome"
        [monthlyExpense]="monthlyExpense"
        [monthlyMutation]="monthlyMutation"
        [savingsTarget]="savingsTarget"
        [isDarkMode]="isDarkMode()"
        (viewAllTransactions)="setActiveTab('transaksi')"
      ></app-overview>

      <!-- Tab 2: Data Rekening -->
      <app-rekening
        [class.hidden]="activeTab() !== 'rekening'"
        [accounts]="accounts()"
        [isDarkMode]="isDarkMode()"
      ></app-rekening>

      <!-- Tab 3: Log Transaksi -->
      <app-transaksi
        [class.hidden]="activeTab() !== 'transaksi'"
        [transactions]="transactions()"
        [isDarkMode]="isDarkMode()"
      ></app-transaksi>

      <!-- Tab 4: Analitik Grafik -->
      <app-analitik
        [class.hidden]="activeTab() !== 'analitik'"
        [isDarkMode]="isDarkMode()"
      ></app-analitik>

      <!-- Tab 5: Profil Pengguna -->
      <app-profile
        [class.hidden]="activeTab() !== 'profile'"
        [username]="username()"
        [email]="email()"
        [phone]="phone()"
        [isDarkMode]="isDarkMode()"
        (openSettings)="openSettingsModal()"
        (logout)="onLogout()"
      ></app-profile>

    </main>

  </div>

  <!-- ======================================================= -->
  <!-- ================= MOBILE BOTTOM NAV BAR (Standard Large Size) ================= -->
  <!-- ======================================================= -->
  <nav 
    [ngClass]="isDarkMode() ? 'bg-slate-950/95 border-slate-900' : 'bg-white border-slate-200 shadow-[0_-2px_10px_rgba(0,0,0,0.03)]'"
    class="fixed bottom-0 left-0 right-0 z-50 md:hidden border-t flex items-center justify-around py-2 transition-all duration-300"
  >
    <!-- Nav 1: Dashboard -->
    <button 
      (click)="setActiveTab('dashboard')"
      [ngClass]="activeTab() === 'dashboard' ? 'text-blue-500 scale-105' : 'text-slate-400 hover:text-slate-600'"
      class="flex flex-col items-center gap-1 py-1 cursor-pointer transition-all duration-150"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="text-[9px] font-bold">Dashboard</span>
    </button>

    <!-- Nav 2: Rekening -->
    <button 
      (click)="setActiveTab('rekening')"
      [ngClass]="activeTab() === 'rekening' ? 'text-blue-500 scale-105' : 'text-slate-400 hover:text-slate-600'"
      class="flex flex-col items-center gap-1 py-1 cursor-pointer transition-all duration-150"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
      </svg>
      <span class="text-[9px] font-bold">Rekening</span>
    </button>

    <!-- Nav 3: Transaksi -->
    <button 
      (click)="setActiveTab('transaksi')"
      [ngClass]="activeTab() === 'transaksi' ? 'text-blue-500 scale-105' : 'text-slate-400 hover:text-slate-600'"
      class="flex flex-col items-center gap-1 py-1 cursor-pointer transition-all duration-150"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
      <span class="text-[9px] font-bold">Transaksi</span>
    </button>

    <!-- Nav 4: Analitik -->
    <button 
      (click)="setActiveTab('analitik')"
      [ngClass]="activeTab() === 'analitik' ? 'text-blue-500 scale-105' : 'text-slate-400 hover:text-slate-600'"
      class="flex flex-col items-center gap-1 py-1 cursor-pointer transition-all duration-150"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
      <span class="text-[9px] font-bold">Analitik</span>
    </button>

    <!-- Nav 5: Profil -->
    <button 
      (click)="setActiveTab('profile')"
      [ngClass]="activeTab() === 'profile' ? 'text-blue-500 scale-105' : 'text-slate-400 hover:text-slate-600'"
      class="flex flex-col items-center gap-1 py-1 cursor-pointer transition-all duration-150"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span class="text-[9px] font-bold">Profil</span>
    </button>
  </nav>

  <!-- ================= POPUP MODAL PENGATURAN PROFIL ================= -->
  <dialog 
    #settingsDialog
    [ngClass]="isDarkMode() ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-800'"
    class="rounded-xl p-4 shadow-2xl border max-w-sm w-11/12 focus:outline-none"
  >
    <div class="space-y-4">
      <div class="flex items-center justify-between border-b pb-2.5" [ngClass]="isDarkMode() ? 'border-slate-800' : 'border-slate-100'">
        <div class="flex items-center gap-2">
          <svg class="w-4.5 h-4.5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <h3 class="text-xs font-bold uppercase tracking-wider">Pengaturan Profil</h3>
        </div>
        <button 
          (click)="closeSettingsModal()" 
          [ngClass]="isDarkMode() ? 'hover:bg-slate-800 text-slate-400 hover:text-white' : 'hover:bg-slate-100 text-slate-500 hover:text-slate-900'"
          class="p-1 rounded-lg transition-colors cursor-pointer"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form (submit)="saveSettings($event)" class="space-y-3.5 pt-1">
        <!-- Input Nama -->
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider mb-1.5" [ngClass]="isDarkMode() ? 'text-slate-400' : 'text-slate-500'">Nama Lengkap</label>
          <input
            type="text"
            [(ngModel)]="editName"
            name="editName"
            required
            [ngClass]="isDarkMode() ? 'bg-slate-950 border-slate-800 text-slate-200 focus:border-blue-500 focus:ring-blue-500' : 'bg-slate-50 border-slate-200 text-slate-800 focus:border-blue-400 focus:ring-blue-400'"
            class="w-full border rounded-lg py-2 px-3 transition-all focus:outline-none focus:ring-1 text-xs shadow-sm"
          />
        </div>

        <!-- Input Email -->
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider mb-1.5" [ngClass]="isDarkMode() ? 'text-slate-400' : 'text-slate-500'">Alamat Email</label>
          <input
            type="email"
            [(ngModel)]="editEmail"
            name="editEmail"
            required
            [ngClass]="isDarkMode() ? 'bg-slate-950 border-slate-800 text-slate-200 focus:border-blue-500 focus:ring-blue-500' : 'bg-slate-50 border-slate-200 text-slate-800 focus:border-blue-400 focus:ring-blue-400'"
            class="w-full border rounded-lg py-2 px-3 transition-all focus:outline-none focus:ring-1 text-xs shadow-sm"
          />
        </div>

        <!-- Input No. Telepon -->
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider mb-1.5" [ngClass]="isDarkMode() ? 'text-slate-400' : 'text-slate-500'">Nomor Telepon</label>
          <input
            type="text"
            [(ngModel)]="editPhone"
            name="editPhone"
            required
            [ngClass]="isDarkMode() ? 'bg-slate-950 border-slate-800 text-slate-200 focus:border-blue-500 focus:ring-blue-500' : 'bg-slate-50 border-slate-200 text-slate-800 focus:border-blue-400 focus:ring-blue-400'"
            class="w-full border rounded-lg py-2 px-3 transition-all focus:outline-none focus:ring-1 text-xs shadow-sm"
          />
        </div>

        <!-- Buttons -->
        <div class="flex gap-3 pt-3 border-t" [ngClass]="isDarkMode() ? 'border-slate-800' : 'border-slate-100'">
          <button
            type="button"
            (click)="closeSettingsModal()"
            [ngClass]="isDarkMode() ? 'bg-slate-950 hover:bg-slate-800 border-slate-800 text-slate-400 hover:text-white' : 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-600 hover:text-slate-900'"
            class="flex-1 py-2 border rounded-lg text-xs font-semibold transition-all cursor-pointer"
          >
            Batal
          </button>
          <button
            type="submit"
            class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white rounded-lg text-xs font-bold transition-all cursor-pointer shadow-md shadow-blue-500/10"
          >
            Simpan
          </button>
        </div>
      </form>
    </div>
  </dialog>

</div>
