<div class="space-y-5">
  <div>
    <h2 [ngClass]="isDarkMode() ? 'text-slate-100' : 'text-slate-900'" class="text-xl font-bold tracking-tight font-serif">Data Rekening</h2>
    <p class="text-xs opacity-60 mt-0.5">Daftar lengkap rekening fisik perbankan (BANK) dan dompet digital (E-WALLET) milik Anda.</p>
  </div>

  <div [ngClass]="isDarkMode() ? 'bg-slate-900/30 border-slate-900/40' : 'bg-white border-slate-250 shadow-sm'" class="border border-t-4 border-t-blue-500 rounded-xl p-4">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs whitespace-nowrap">
        <thead>
          <tr [ngClass]="isDarkMode() ? 'border-slate-800 text-slate-400' : 'border-slate-200 text-slate-600'" class="border-b font-bold uppercase tracking-wider">
            <th class="pb-2.5 pr-6">Rekening</th>
            <th class="pb-2.5 pr-6">Tipe</th>
            <th class="pb-2.5 pr-6">Fungsi Khusus</th>
            <th class="pb-2.5 pr-6">Keterangan</th>
            <th class="pb-2.5 text-right">Saldo Saat Ini</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200/10 dark:divide-slate-850">
          <tr *ngFor="let acc of accounts()" class="hover:bg-slate-105/30 dark:hover:bg-slate-900/20 transition-colors">
            <td [ngClass]="isDarkMode() ? 'text-slate-200' : 'text-slate-800'" class="py-3 pr-6 font-bold">{{ acc.name }}</td>
            <td class="py-3 pr-6"><span class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-[10px] font-bold text-slate-700 dark:text-slate-300">{{ acc.type }}</span></td>
            <td class="py-3 pr-6"><span class="text-blue-500 font-semibold">{{ acc.role }}</span></td>
            <td [ngClass]="isDarkMode() ? 'text-slate-350' : 'text-slate-700'" class="py-3 pr-6">{{ acc.description }}</td>
            <td class="py-3 text-right font-bold">{{ acc.balance | currency:'IDR':'Rp ':'1.0-0' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
