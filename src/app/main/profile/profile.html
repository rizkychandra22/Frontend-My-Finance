<div class="space-y-5">
  <div>
    <h2 [ngClass]="isDarkMode() ? 'text-slate-100' : 'text-slate-900'" class="text-xl font-bold tracking-tight font-serif">Profil Pengguna</h2>
    <p class="text-xs opacity-60 mt-0.5">Detail akun administrator dan konfigurasi preferensi aplikasi.</p>
  </div>

  <div [ngClass]="isDarkMode() ? 'bg-slate-900/30 border-slate-900/40' : 'bg-white border-slate-250 shadow-sm'" class="border border-t-4 border-t-blue-500 rounded-xl p-4 max-w-sm">
    <div class="flex flex-col items-center text-center space-y-3.5">
      <div class="w-16 h-16 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xl shadow-md shadow-blue-500/10">
        RC
      </div>
      <div>
        <h3 [ngClass]="isDarkMode() ? 'text-slate-100' : 'text-slate-900'" class="text-base font-bold">{{ username() }}</h3>
        <p class="text-[11px] text-slate-400">{{ email() }} | Personal Planner</p>
      </div>
      <div class="w-full pt-3 border-t border-slate-200/10 dark:border-slate-850 space-y-1.5 text-left text-[11px]">
        <div class="flex justify-between py-1"><span class="text-slate-400">Tipe Akun</span><span class="font-bold text-emerald-500">Premium Personal</span></div>
        <div class="flex justify-between py-1"><span class="text-slate-400">Nomor Telepon</span><span class="font-bold text-emerald-500">{{ phone() }}</span></div>
        <div class="flex justify-between py-1"><span class="text-slate-400">Periode Anggaran</span><span class="font-bold text-emerald-500">Agustus 2026</span></div>
        <div class="flex justify-between py-1"><span class="text-slate-400">Sinkronisasi Rekening</span><span class="font-bold text-emerald-500">Terkoneksi (Terkini)</span></div>
      </div>
      <div class="w-full flex gap-2 mt-3">
        <button 
          (click)="openSettings.emit()" 
          class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-xl text-[11px] hover:scale-[1.02] active:scale-[0.98] transition-all cursor-pointer"
        >
          Ubah Profil
        </button>
        <button 
          (click)="logout.emit()" 
          class="flex-1 bg-red-600/10 text-red-500 border border-red-500/20 font-bold py-2 rounded-xl text-[11px] hover:bg-red-600 hover:text-white transition-all cursor-pointer"
        >
          Keluar Sesi
        </button>
      </div>
    </div>
  </div>
</div>
