<div class="space-y-5">
  <div>
    <h2 [ngClass]="isDarkMode() ? 'text-xl text-slate-100' : 'text-xl text-slate-900'" class="font-bold tracking-tight font-serif">Analitik Grafik & Statistik</h2>
    <p class="text-xs opacity-60 mt-0.5">Laporan makro keuangan, analisis per-rekening, dan presentase alokasi dana.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <div [ngClass]="isDarkMode() ? 'bg-slate-900/30 border-slate-900/40' : 'bg-white border-slate-250 shadow-sm'" class="border border-t-4 border-t-blue-500 rounded-xl p-4">
      <h3 class="text-xs font-bold uppercase tracking-wider mb-3">Total Aset Tabungan</h3>
      <div class="h-56 flex items-center justify-center border border-dashed border-slate-700/30 rounded-lg">
        <span class="text-[11px] opacity-50">Grafik Distribusi Bank vs E-Wallet (Segera Datang)</span>
      </div>
    </div>
    <div [ngClass]="isDarkMode() ? 'bg-slate-900/30 border-slate-900/40' : 'bg-white border-slate-250 shadow-sm'" class="border border-t-4 border-t-blue-500 rounded-xl p-4">
      <h3 class="text-xs font-bold uppercase tracking-wider mb-3">Analisis Pengeluaran Harian</h3>
      <div class="h-56 flex items-center justify-center border border-dashed border-slate-700/30 rounded-lg">
        <span class="text-[11px] opacity-50">Grafik Proporsi Kategori Pengeluaran (Segera Datang)</span>
      </div>
    </div>
  </div>
</div>
