<div [ngClass]="isDarkMode() ? 'bg-slate-950 text-slate-100' : 'bg-[#FAF8F5] text-slate-800'" class="min-h-screen flex flex-col justify-between p-6 transition-colors duration-300">

  <!-- Top Right Theme Toggle -->
  <div class="flex justify-end p-2">
    <button 
      (click)="toggleTheme()" 
      [ngClass]="isDarkMode() ? 'bg-slate-900 border-slate-800 text-amber-400' : 'bg-white border-slate-200 text-slate-600'"
      class="w-10 h-10 rounded-full border flex items-center justify-center cursor-pointer shadow-sm hover:scale-105 active:scale-95 transition-all duration-150 focus:outline-none"
      aria-label="Toggle Theme"
    >
      <!-- Sun Icon (Dark Mode) -->
      <svg *ngIf="isDarkMode()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
      </svg>
      <!-- Moon Icon (Light Mode) -->
      <svg *ngIf="!isDarkMode()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>
  </div>

  <!-- Centered Login Form Wrapper -->
  <div class="flex-grow flex items-center justify-center max-w-sm w-full mx-auto">
    <div class="w-full space-y-8">
      
      <!-- Typography Header -->
      <div class="text-center">
        <h2 [ngClass]="isDarkMode() ? 'text-slate-100' : 'text-slate-900'" class="text-3xl font-bold tracking-tight font-serif">Selamat datang kembali</h2>
        <p [ngClass]="isDarkMode() ? 'text-slate-400' : 'text-slate-500'" class="text-sm mt-2">Silahkan login untuk management internal</p>
      </div>

      <!-- Error Alert Message -->
      <div *ngIf="errorMessage()" class="bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-xl p-4 flex items-center gap-3">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>

      <!-- Input Form -->
      <form (submit)="onLogin($event)" class="space-y-6">
        
        <!-- Input Akun (Identifier) -->
        <div>
          <label [ngClass]="isDarkMode() ? 'text-slate-300' : 'text-slate-700'" class="block text-sm font-semibold mb-2">Akun</label>
          <input
            type="text"
            [(ngModel)]="identifier"
            name="identifier"
            placeholder="Username atau Email"
            [ngClass]="isDarkMode() ? 'bg-slate-900/60 border-slate-800 text-slate-200 placeholder-slate-600 focus:border-blue-500 focus:ring-blue-500' : 'bg-white border-slate-250 text-slate-800 placeholder-slate-400 focus:border-blue-400 focus:ring-blue-400'"
            class="w-full border rounded-xl py-3 px-4 transition-all focus:outline-none focus:ring-1 text-sm shadow-sm"
            [disabled]="isLoading()"
          />
        </div>

        <!-- Input Kata Sandi -->
        <div>
          <label [ngClass]="isDarkMode() ? 'text-slate-300' : 'text-slate-700'" class="block text-sm font-semibold mb-2">Kata Sandi</label>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            [ngClass]="isDarkMode() ? 'bg-slate-900/60 border-slate-800 text-slate-200 placeholder-slate-600 focus:border-blue-500 focus:ring-blue-500' : 'bg-white border-slate-250 text-slate-800 placeholder-slate-400 focus:border-blue-400 focus:ring-blue-400'"
            class="w-full border rounded-xl py-3 px-4 transition-all focus:outline-none focus:ring-1 text-sm shadow-sm"
            [disabled]="isLoading()"
          />
        </div>

        <!-- Submit Button (Cobalt Blue) -->
        <button
          type="submit"
          [disabled]="isLoading()"
          class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold rounded-xl py-3.5 transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer shadow-md shadow-blue-500/10 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <!-- Loading Spinner -->
          <svg *ngIf="isLoading()" class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ isLoading() ? 'Mencocokkan...' : 'Masuk' }}</span>
        </button>

      </form>

      <!-- Testing Hint Box -->
      <div class="text-center pt-4">
        <p [ngClass]="isDarkMode() ? 'text-slate-600' : 'text-slate-400'" class="text-xs">
          Uji coba: <code class="text-blue-500 font-mono">test@example.com</code> & password <code class="text-blue-500 font-mono">password</code>
        </p>
      </div>

    </div>
  </div>

  <!-- Elegant Footer -->
  <footer class="text-center py-4">
    <p [ngClass]="isDarkMode() ? 'text-slate-600' : 'text-slate-500'" class="text-xs tracking-wider">
      Sistem Manajemen Internal My-Finance Release v1.0.0
    </p>
  </footer>

</div>
